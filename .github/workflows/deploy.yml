name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  lint-check:
    uses: ./.github/workflows/check.yml

  build-and-deploy:
    needs: lint-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 引擎(twgpu + rust/twengine)是 submodule + 本地 crate,构建时从源码编译 wasm
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Create cache directory
        run: mkdir -p cache

      - name: Read twgpu revision
        id: twgpu
        run: echo "sha=$(git -C vendor/twgpu rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 产物 15MB 左右(wasm + 贴图 + 音效),子模块/crate/补丁都没变的话直接复用,
      # 跳过 5~8 分钟的 wasm 编译和 131 个 .wv 的转码
      - name: Restore engine build
        id: engine
        uses: actions/cache@v4
        with:
          # 只缓存"生成物"。static/ddnet/engine 下的 demo.js / engine.js / sound.js
          # 是手写源码、跟着 git 走,绝不能进缓存 —— 命中的旧包会把它们覆盖成老版本。
          path: |
            static/ddnet/engine/pkg
            static/ddnet/engine/assets
            static/ddnet/engine/sounds
            static/ddnet/engine/version.json
            cache/engine
          key: engine-${{ steps.twgpu.outputs.sha }}-${{ hashFiles('patches/**', 'scripts/build-engine.ts', 'scripts/twgpu-patch-prepare.py', 'scripts/twgpu-templates/**', 'rust/twengine/src/**', 'rust/twengine/Cargo.toml', 'rust/twengine/Cargo.lock') }}

      # 下面这几步只在真的要重新编译 wasm 时才需要(产物缓存没命中)
      - name: Restore cargo cache
        id: cargo-cache
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/.wasm-pack
          key: cargo-${{ runner.os }}-${{ hashFiles('vendor/twgpu/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # 编译产物(约 800MB):补丁变了但依赖没动时,cargo 只需要重编 twgpu 那几个 crate。
      # key 里带补丁 hash,同时用 restore-keys 兜底复用同一次子模块提交的旧产物
      - name: Restore twgpu build artifacts
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            vendor/twgpu/target
            rust/twengine/target
          key: twgpu-target-${{ runner.os }}-${{ steps.twgpu.outputs.sha }}-${{ hashFiles('patches/**', 'scripts/build-engine.ts', 'scripts/twgpu-patch-prepare.py', 'scripts/twgpu-templates/**', 'rust/twengine/src/**', 'rust/twengine/Cargo.toml', 'rust/twengine/Cargo.lock') }}
          restore-keys: |
            twgpu-target-${{ runner.os }}-${{ steps.twgpu.outputs.sha }}-
            twgpu-target-${{ runner.os }}-

      - name: Add wasm target
        if: steps.engine.outputs.cache-hit != 'true'
        run: rustup target add wasm32-unknown-unknown

      - name: Install ffmpeg
        if: steps.engine.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip

      - name: Install wasm-pack
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl -sSfL -o /tmp/wasm-pack.tar.gz "https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz"
            tar xzf /tmp/wasm-pack.tar.gz -C /tmp
            sudo install /tmp/wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
          fi
          wasm-pack --version

      - name: Build Project
        run: bun --bun run build

      - name: Move rust scripts to build folder
        run: mv rust build

      - name: Bundle scripts
        run: bun run bundle

      - name: Run bun install in build folder
        run: cd build && bun install && cd ..

      - name: Archive Build Folder
        run: tar -czvf build.tar.gz -C build .

      - name: Copy Files to Remote Server
        env:
          TARGET_HOST: ${{ secrets.TARGET_HOST }}
          TARGET_DIRECTORY: ${{ secrets.TARGET_DIRECTORY }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          scp -o StrictHostKeyChecking=no build.tar.gz $REMOTE_USER@$TARGET_HOST:$TARGET_DIRECTORY

      - name: Deploy on Remote Server
        env:
          TARGET_HOST: ${{ secrets.TARGET_HOST }}
          TARGET_DIRECTORY: ${{ secrets.TARGET_DIRECTORY }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PRE_DEPLOY_SCRIPT: ${{ secrets.PRE_DEPLOY_SCRIPT }}
          POST_DEPLOY_SCRIPT: ${{ secrets.POST_DEPLOY_SCRIPT }}
        run: |
          ssh -o StrictHostKeyChecking=no $REMOTE_USER@$TARGET_HOST "
            $PRE_DEPLOY_SCRIPT
            tar -xzvf $TARGET_DIRECTORY/build.tar.gz -C $TARGET_DIRECTORY
            $POST_DEPLOY_SCRIPT
          "
