name: Check

on:
  push:
  pull_request:
  workflow_call:

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun fmt --check

      - name: Check
        run: bun run check
